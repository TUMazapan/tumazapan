<svg viewBox="0 0 800 400" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Puntas de las flechas -->
    <marker id="arrowRight" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7D786F" />
    </marker>
    <marker id="arrowLeft" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#7D786F" />
    </marker>
  </defs>

  <style>
    .title { font-family: 'Newsreader', Georgia, serif; font-size: 26px; font-weight: 700; fill: #F4F1EA; text-anchor: middle; }
    .label { font-family: 'Literata', serif; font-size: 15px; font-weight: 700; fill: #E1DDD5; text-anchor: middle; }
    .virtue { font-family: 'Literata', serif; font-size: 15px; font-weight: 700; fill: #E07A5F; text-anchor: middle; }
    .triangle { stroke: #7D786F; stroke-width: 2.5; fill: transparent; stroke-linejoin: round; }
    .line { stroke: #7D786F; stroke-width: 2; }
  </style>

  <!-- Pirámide ALMA -->
  <text x="200" y="40" class="title">ALMA</text>
  <polygon points="200,60 70,350 330,350" class="triangle" />
  <line x1="155" y1="160" x2="245" y2="160" class="line" />
  <line x1="110" y1="260" x2="290" y2="260" class="line" />
  
  <text x="200" y="140" class="label">RAZÓN</text>
  <text x="200" y="215" class="label">PARTE</text>
  <text x="200" y="235" class="label">IRASCIBLE</text>
  <text x="200" y="310" class="label">PARTE</text>
  <text x="200" y="330" class="label">CONCUPISCIBLE</text>

  <!-- Pirámide POLIS -->
  <text x="600" y="40" class="title">POLIS</text>
  <polygon points="600,60 470,350 730,350" class="triangle" />
  <line x1="555" y1="160" x2="645" y2="160" class="line" />
  <line x1="510" y1="260" x2="690" y2="260" class="line" />
  
  <text x="600" y="130" class="label">FILÓSOFO</text>
  <text x="600" y="150" class="label">REY</text>
  <text x="600" y="225" class="label">GUARDIANES</text>
  <text x="600" y="320" class="label">ARTESANOS</text>

  <!-- VIRTUDES (Centro) -->
  <text x="400" y="130" class="virtue">PRUDENCIA O</text>
  <text x="400" y="150" class="virtue">SABIDURÍA</text>
  <text x="400" y="215" class="virtue">FORTALEZA O</text>
  <text x="400" y="235" class="virtue">VALENTÍA</text>
  <text x="400" y="320" class="virtue">TEMPLANZA</text>

  <!-- Flechas de conexión -->
  <line x1="255" y1="135" x2="330" y2="135" class="line" marker-end="url(#arrowRight)"/>
  <line x1="545" y1="135" x2="470" y2="135" class="line" marker-end="url(#arrowLeft)"/>

  <line x1="270" y1="220" x2="330" y2="220" class="line" marker-end="url(#arrowRight)"/>
  <line x1="530" y1="220" x2="470" y2="220" class="line" marker-end="url(#arrowLeft)"/>

  <line x1="300" y1="315" x2="340" y2="315" class="line" marker-end="url(#arrowRight)"/>
  <line x1="500" y1="315" x2="460" y2="315" class="line" marker-end="url(#arrowLeft)"/>
</svg>
