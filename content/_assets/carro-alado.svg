<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#0a0e1f"/>

  <text x="500" y="55" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="1">EL MITO DEL CARRO ALADO</text>
  <text x="500" y="82" text-anchor="middle" fill="#f0a83c" font-size="17" font-weight="600">Platón, Fedro, 246a&#8211;254e</text>

  <!-- upper region: llanura de la verdad -->
  <rect x="60" y="105" width="880" height="90" fill="none" stroke="#f0a83c" stroke-width="1.5" stroke-dasharray="6,5"/>
  <text x="500" y="135" text-anchor="middle" fill="#f0a83c" font-size="18" font-weight="700">LLANURA DE LA VERDAD</text>
  <text x="500" y="158" text-anchor="middle" fill="#dddddd" font-size="13">morada de las Ideas &#8212; allí el alma, cuando es perfecta y alada, contempla el ser mismo</text>
  <text x="500" y="178" text-anchor="middle" fill="#dddddd" font-size="13">de las cosas y se alimenta de esa visión (conocimiento previo a la encarnación)</text>

  <!-- ascending arrow -->
  <path d="M 500 300 C 460 250, 460 220, 500 200" fill="none" stroke="#f0a83c" stroke-width="3" marker-end="url(#arrowUp)"/>
  <defs>
    <marker id="arrowUp" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f0a83c"/>
    </marker>
    <marker id="arrowDown" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- chariot core: auriga -->
  <rect x="430" y="300" width="140" height="60" rx="8" fill="#eeeeee"/>
  <text x="500" y="325" text-anchor="middle" fill="#111111" font-size="15" font-weight="800">AURIGA</text>
  <text x="500" y="343" text-anchor="middle" fill="#333333" font-size="11">RAZÓN &#8212; logistikón</text>
  <text x="500" y="356" text-anchor="middle" fill="#333333" font-size="10">gobierna, delibera, aspira al bien</text>

  <!-- reins -->
  <line x1="430" y1="330" x2="230" y2="330" stroke="#cccccc" stroke-width="2"/>
  <line x1="570" y1="330" x2="770" y2="330" stroke="#cccccc" stroke-width="2"/>

  <!-- white horse (irascible) -->
  <rect x="130" y="300" width="200" height="70" rx="10" fill="#f4f4f4" stroke="#f0a83c" stroke-width="2"/>
  <text x="230" y="325" text-anchor="middle" fill="#111111" font-size="15" font-weight="800">CABALLO BLANCO</text>
  <text x="230" y="343" text-anchor="middle" fill="#333333" font-size="11">PARTE IRASCIBLE &#8212; thymoeidés</text>
  <text x="230" y="358" text-anchor="middle" fill="#333333" font-size="10">honor y valentía; dócil a la razón</text>

  <!-- black horse (concupiscible) -->
  <rect x="670" y="300" width="200" height="70" rx="10" fill="#2b2b2b" stroke="#c0392b" stroke-width="2"/>
  <text x="770" y="325" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="800">CABALLO NEGRO</text>
  <text x="770" y="343" text-anchor="middle" fill="#e6b8b8" font-size="11">PARTE CONCUPISCIBLE &#8212; epithymetikón</text>
  <text x="770" y="358" text-anchor="middle" fill="#e6b8b8" font-size="10">apetitos y placeres; indócil, tira hacia abajo</text>

  <!-- descending arrow to earth -->
  <path d="M 770 375 C 780 420, 720 450, 620 460" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#arrowDown)"/>
  <text x="760" y="410" fill="#c0392b" font-size="11" font-style="italic">si el auriga no lo doma:</text>
  <text x="760" y="424" fill="#c0392b" font-size="11" font-style="italic">caída del alma</text>

  <!-- earth / sensible world -->
  <rect x="60" y="470" width="880" height="90" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,5"/>
  <text x="500" y="500" text-anchor="middle" fill="#cfcfcf" font-size="18" font-weight="700">MUNDO SENSIBLE (encarnación)</text>
  <text x="500" y="523" text-anchor="middle" fill="#aaaaaa" font-size="13">el alma pierde sus alas, olvida lo contemplado y queda presa en un cuerpo mortal</text>
  <text x="500" y="543" text-anchor="middle" fill="#aaaaaa" font-size="13">&#8212; la filosofía, como amor al saber, es el recuerdo (anamnesis) que la purifica y le hace recobrar el vuelo</text>

  <text x="500" y="595" text-anchor="middle" fill="#777777" font-size="12">Elaboración propia a partir de Fedro, 246a&#8211;254e</text>
</svg>
